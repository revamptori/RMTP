[package]
name = "rmtp"
version = "0.1.0"
edition = "2021"
description = "RMTP - an extremely lightweight SMTP server/relay"
authors = ["RMTP Project"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "rustsmtp"
path = "src/main.rs"

[dependencies]
# Async runtime and networking
tokio = { version = "1", features = ["full"] }
bytes = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# TLS (rustls)
rustls = "0.23"
rustls-pemfile = "2"
rustls-webpki = "0.101"
tokio-rustls = "0.26"

# Configuration
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_derive = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Cryptography / security
subtle = "2"        # constant-time credential comparison
base64 = "0.22"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
